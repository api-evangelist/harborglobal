name: Harbor Global
description: 'Harbor Global is a global professional-services firm delivering technology,
  operations, strategy, and intelligence consulting to law firms, corporate legal
  departments, and government legal teams. Its practice areas span legal-technology
  and operations (application management, process automation, AI enablement), strategic
  advisory, intelligence and research/library services, and vendor governance, delivered
  by a global team of specialists. Harbor has grown through acquisitions such as iTrain
  (UK legal-technology training and AI enablement) and CE Global Partners (HCM/HR and
  payroll transformation). It is a portfolio company of Norwest Venture Partners. Harbor
  Global is a services company and does not publish a public API, developer portal,
  or SDKs; this profile is maintained in the API Evangelist network for company identity
  and discovery.'
